name: Windows ext4 tools

# Builds the small debugfs.exe bundle the Windows installer uses to put an SSH key on the Pi's Linux partition,
# and tests it on a real Windows machine: first against an image file, then against a virtual disk through a
# \\.\PhysicalDrive path, the same way the installer addresses the SD card.
#
#   Releases > Publish     -> builds, tests, attaches ext4-tools-windows.zip to the release
#   Actions tab > Run      -> builds and tests; download from the run's artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ext4-tools.yml"
      - "scripts/ext4-inject.ps1"

permissions:
  contents: write

jobs:
  tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true

      - name: Build e2fsprogs (MSYS2 has no package for it)
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed base-devel gcc make git > pacman.log 2>&1 || { echo "::error::pacman failed: $(tail -c 600 pacman.log | tr '\n' '|')"; exit 1; }
          git clone --depth 1 --branch v1.47.2 https://github.com/tytso/e2fsprogs.git src
          cd src
          # upstream's Cygwin branch calls the Microsoft C runtime name; Cygwin spells it get_osfhandle
          sed -i 's|#include "windows.h"|#include <io.h>\n#include "windows.h"|; s/_get_osfhandle/get_osfhandle/' lib/ext2fs/getsize.c
          if ! ( ./configure --prefix=/usr/local --disable-nls --disable-fuse2fs --disable-defrag --disable-uuidd --disable-e2initrd-helper --without-libarchive > ../configure.log 2>&1 && make -k -j4 > ../make.log 2>&1 ); then
            echo "::error::build failed: configure: $(tail -c 500 ../configure.log | tr '\n' '|') MAKE: $(grep -i 'error' ../make.log | head -6 | cut -c1-300 | tr '\n' '|') TAIL: $(tail -c 700 ../make.log | tr '\n' '|')"
            exit 1
          fi
          make install > ../install.log 2>&1 || true
          ls -l /usr/local/sbin /usr/local/bin | head -30

      - name: Collect debugfs.exe and the libraries it needs
        shell: msys2 {0}
        run: |
          mkdir -p out/ext4-tools
          cp src/debugfs/debugfs.exe out/ext4-tools/
          cp src/misc/mke2fs.exe src/e2fsck/e2fsck.exe out/
          cp /usr/bin/msys-2.0.dll out/ext4-tools/
          for exe in out/ext4-tools/debugfs.exe out/mke2fs.exe out/e2fsck.exe; do
            for dll in $(ldd "$exe" | awk '/\/usr\/bin\// {print $3}'); do cp -n "$dll" out/ext4-tools/; done
          done
          cp out/ext4-tools/*.dll out/
          ls -l out out/ext4-tools

      - name: Test against an image file (tools run from a plain folder, no MSYS on the path)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          trap { Write-Host ("::error::" + ($_.Exception.Message -replace "[\r\n]+", " | ") + " AT " + ($_.InvocationInfo.PositionMessage -replace "[\r\n]+", " | ")); exit 1 }
          $out = Join-Path $PWD "out"
          # a fake Fedora IoT root: /ostree/deploy/fedora-iot/var/roothome
          $root = Join-Path $out "root"
          New-Item -ItemType Directory -Force -Path "$root/ostree/deploy/fedora-iot/var/roothome" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/ostree/deploy/fedora-iot/deploy/abc.0/etc" | Out-Null
          $img = Join-Path $out "root.ext4"
          $fs = [System.IO.File]::Create($img); $fs.SetLength(64MB); $fs.Close()
          $rootU = ($root -replace "\\", "/")
          $imgU = ($img -replace "\\", "/")
          & "$out/mke2fs.exe" -q -F -t ext4 -O metadata_csum,64bit,extent -d $rootU $imgU
          if ($LASTEXITCODE -ne 0) { throw "mke2fs failed" }
          ssh-keygen -q -t ed25519 -N '""' -f "$out/testkey"
          . ./scripts/ext4-inject.ps1
          Add-RootSshKey -Debugfs "$out/ext4-tools/debugfs.exe" -Target $imgU -PublicKeyFile "$out/testkey.pub"
          # again: running it twice must work too
          Add-RootSshKey -Debugfs "$out/ext4-tools/debugfs.exe" -Target $imgU -PublicKeyFile "$out/testkey.pub"
          $fsck = & "$out/e2fsck.exe" -fn $imgU 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          Write-Host ($fsck -join "`n")
          if ($code -ne 0) { throw ("e2fsck exit code $code : " + ($fsck -join " | ")) }
          Write-Host "image file test passed"

      - name: Test against a virtual disk through a PhysicalDrive path
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "::notice::vhd step started"
          $ErrorActionPreference = "Stop"
          trap { Write-Host ("::error::" + ($_.Exception.Message -replace "[\r\n]+", " | ") + " AT " + ($_.InvocationInfo.PositionMessage -replace "[\r\n]+", " | ")); exit 1 }
          $out = Join-Path $PWD "out"
          $vhd = Join-Path $env:RUNNER_TEMP "ext4test.vhd"
          @"
          create vdisk file="$vhd" maximum=200 type=fixed
          select vdisk file="$vhd"
          attach vdisk
          convert gpt
          create partition primary
          "@ | Out-File -Encoding ascii "$env:RUNNER_TEMP\dp.txt"
          $dpout = diskpart /s "$env:RUNNER_TEMP\dp.txt" 2>&1 | ForEach-Object { "$_" }
          Write-Host ("::notice::diskpart exit $LASTEXITCODE : " + (($dpout -join " | ") -replace "[\r\n]+", " | "))
          $d = Get-DiskImage -ImagePath $vhd | Get-Disk
          $n = $d.Number
          if ($d.IsSystem -or $d.IsBoot -or $n -eq 0) { throw "refusing to use disk ${n}: it looks like the system disk" }
          $p = Get-Partition -DiskNumber $n | Where-Object { $_.Type -ne "Reserved" } | Select-Object -First 1
          Write-Host "::notice::disk $n partition offset $($p.Offset) size $($p.Size) style $($d.PartitionStyle)"
          $target = "//./PhysicalDrive${n}?offset=$($p.Offset)"
          function Warnout($label, $text) { Write-Host ("::warning::" + $label + ": " + (($text -join " | ") -replace "[\r\n]+", " | ")) }
          # make an ext4 filesystem inside that partition, then add the key, as the installer does on the card
          $kb = [int]($p.Size / 1024 - 64)
          $o1 = & "$out/mke2fs.exe" -q -F -t ext4 -O metadata_csum,64bit,extent $target $kb 2>&1 | ForEach-Object { "$_" }
          Warnout "mke2fs exit $LASTEXITCODE target=$target kb=$kb" $o1
          $o2 = & "$out/ext4-tools/debugfs.exe" -R "ls -p /" $target 2>&1 | ForEach-Object { "$_" }
          Warnout "debugfs ls / exit $LASTEXITCODE" $o2
          $cf = Join-Path $out "mk.txt"
          [System.IO.File]::WriteAllText($cf, "mkdir /ostree`nmkdir /ostree/deploy`nmkdir /ostree/deploy/fedora-iot`nmkdir /ostree/deploy/fedora-iot/var`n")
          $o3 = & "$out/ext4-tools/debugfs.exe" -w -f ($cf -replace "\\", "/") $target 2>&1 | ForEach-Object { "$_" }
          Warnout "debugfs mkdir exit $LASTEXITCODE" $o3
          $o4 = & "$out/ext4-tools/debugfs.exe" -R "ls -p /ostree/deploy" $target 2>&1 | ForEach-Object { "$_" }
          Warnout "debugfs ls deploy" $o4
          . ./scripts/ext4-inject.ps1
          Add-RootSshKey -Debugfs "$out/ext4-tools/debugfs.exe" -Target $target -PublicKeyFile "$out/testkey.pub"
          Write-Host "physical drive test passed"

      - name: Show the virtual disk test log
        if: always()
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\vhd.log"
          if (Test-Path $f) {
            $t = (Get-Content -Raw $f) -replace "[\r\n]+", " | "
            if ($t.Length -gt 3500) { $t = $t.Substring($t.Length - 3500) }
            Write-Host "::warning::VHDLOG $t"
          } else { Write-Host "::warning::VHDLOG no log file" }

      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path out/ext4-tools/* -DestinationPath ext4-tools-windows.zip
          (Get-FileHash -Algorithm SHA256 ext4-tools-windows.zip).Hash.ToLower() + "  ext4-tools-windows.zip" | Out-File -Encoding ascii ext4-tools-windows.zip.sha256
          Get-Item ext4-tools-windows.zip*

      - uses: actions/upload-artifact@v4
        with:
          name: ext4-tools-windows
          path: |
            ext4-tools-windows.zip
            ext4-tools-windows.zip.sha256
          retention-days: 14

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ext4-tools-windows.zip ext4-tools-windows.zip.sha256 --clobber
