name: Build the Pi image

# Builds the container image for the Raspberry Pi (arm64) and attaches it to a release,
# so installers can download one file instead of building it.
#
#   Releases > Draft a new release > Publish     -> builds, then attaches the image to that release
#   Actions tab > "Build the Pi image" > Run     -> builds only; download it from the run's artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  image:
    # A native arm64 runner (free for public repositories), so nothing is emulated.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          podman build --platform linux/arm64 -t localhost/shelly-monitor:latest -f Containerfile .
          podman save -o shelly-monitor-image.tar localhost/shelly-monitor:latest
          sha256sum shelly-monitor-image.tar > shelly-monitor-image.tar.sha256
          ls -lh shelly-monitor-image.tar*

      - name: Check the image starts
        run: podman run --rm localhost/shelly-monitor:latest python -c "import app.api; print('app imports fine')"

      - uses: actions/upload-artifact@v4
        with:
          name: shelly-monitor-image
          path: |
            shelly-monitor-image.tar
            shelly-monitor-image.tar.sha256
          retention-days: 7

      - name: Attach the image to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            shelly-monitor-image.tar shelly-monitor-image.tar.sha256 --clobber
