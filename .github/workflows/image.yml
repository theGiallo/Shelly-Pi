name: Build the Pi image

# Builds the container image for the Raspberry Pi (arm64) and attaches it to a release,
# so installers can download one file instead of building it.
#
#   Releases > Draft a new release > Publish     -> builds, then attaches the image to that release
#   Actions tab > "Build the Pi image" > Run     -> builds only; download it from the run's artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (if needed) and attach the image to, e.g. v0.1.1. Empty = build only."
        required: false
        default: ""

permissions:
  contents: write   # needed to create the release

jobs:
  image:
    # A native arm64 runner (free for public repositories), so nothing is emulated.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          podman build --platform linux/arm64 -t localhost/shelly-pi:latest -f Containerfile .
          podman save -o shelly-pi-image.tar localhost/shelly-pi:latest
          sha256sum shelly-pi-image.tar > shelly-pi-image.tar.sha256
          ls -lh shelly-pi-image.tar*

      - name: Check the image starts
        run: podman run --rm localhost/shelly-pi:latest python -c "import app.api; print('app imports fine')"

      - uses: actions/upload-artifact@v4
        with:
          name: shelly-pi-image
          path: |
            shelly-pi-image.tar
            shelly-pi-image.tar.sha256
          retention-days: 7

      - name: Attach the image to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # The notes are this version's section of CHANGELOG.md.
            awk -v v="${TAG#v}" '/^## /{p=($2==v)} p&&!/^## /' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes-file notes.md
          fi
          # The file you download is named with the version, like shelly-pi-image_v0.1.6.tar. The plain name
          # stays for now, because the Update page of versions up to 0.1.5 looks for exactly that.
          cp shelly-pi-image.tar "shelly-pi-image_${TAG}.tar"
          sha256sum "shelly-pi-image_${TAG}.tar" > "shelly-pi-image_${TAG}.tar.sha256"
          gh release upload "$TAG" "shelly-pi-image_${TAG}.tar" "shelly-pi-image_${TAG}.tar.sha256" \
            shelly-pi-image.tar shelly-pi-image.tar.sha256 --clobber
