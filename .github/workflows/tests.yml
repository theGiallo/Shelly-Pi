name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.log || {
            # copy the failures into the run's annotations, which are easy to read without opening the logs
            grep -E "^(FAILED|ERROR)|Error" pytest.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:250}"; done
            exit 1
          }
